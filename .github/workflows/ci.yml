name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not models"

  models:
    # the real speech models, the shared recogniser and two whole simulated calls in real time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: data/models
          key: models-${{ hashFiles('config/assets.yaml') }}
      - run: dcr fetch --only runtime,sim && rm -rf data/models/downloads
      - run: pytest -q -m "models and not slow"
      - run: pytest -q -m "slow" -x

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [lint, unit, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t duplex-call-runtime:ci .
      - name: smoke test the image
        run: |
          docker run -d --name dcr -p 8000:8000 duplex-call-runtime:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/healthz && break; sleep 3; done
          curl -fsS localhost:8000/healthz
          curl -fsS -X POST "localhost:8000/twilio/voice?lang=de" | grep -q 'wss://localhost:8000/media'
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          docker logs dcr | tail -20
