# Every threshold and budget the runtime uses. Code reads these; it holds no tuning constants.

audio:
  telephony_rate: 8000        # G.711 mu-law, as phone networks and Twilio Media Streams carry it
  model_rate: 16000           # VAD and STT run at 16 kHz
  frame_ms: 20                # one media message carries 20 ms (160 mu-law bytes)

vad:
  threshold: 0.5
  window_samples: 512         # Silero window at 16 kHz (32 ms)
  min_speech_ms: 120          # shorter blips are ignored

stt:
  en: stt_en_nemo             # stt_en_streaming is 7x cheaper and much less accurate on phone audio (docs/MEASUREMENTS.md)
  de: stt_whisper_base        # Whisper per pause; stt_whisper_tiny is faster and much worse
  flush_seconds: 0.4          # silence pushed through the recogniser at a pause, so its last word is out
  flush_after_ms: 60          # ... this far into the pause if the turn looks finished (turn/policy.flush_due)
  flush_in_number_ms: 600     # ... but only after a real pause while a number is being dictated

turn:
  # When the caller pauses, the agent asks: has the turn ended? (docs/adr/0002)
  speculate_after_ms: 120     # a likely end this early starts the LLM (no audio until the turn is committed)
  evaluate_after_ms: 200      # earliest pause after which the agent may answer
  respond_probability: 0.55   # end-of-turn probability needed to answer
  speculate_probability: 0.35 # start the LLM early (cancelled if the caller goes on)
  max_pause_ms: 1400          # answer anyway after this much silence
  entity_max_pause_ms: 2600   # ... unless a number, date or IBAN is half-dictated
  silence_only_ms: 800        # the baseline policy: answer after this much silence, nothing else

barge_in:
  min_speech_ms: 300          # caller speech this long while the agent talks interrupts it
  backchannel_max_ms: 900     # "mhm", "yeah", "genau" shorter than this never interrupt
  resume_after_ms: 700        # a false interruption (noise, cough, no words) resumes the agent
  hold: duck                  # while it is unclear: duck (keep talking 14 dB down) or pause (stop the audio)
  duck_db: 14

aec:
  enabled: true
  taps: 1280                  # echo path covered: 160 ms at 8 kHz (bulk delay plus the hybrid's response)
  step: 0.5                   # frequency-domain step, normalised per bin (docs/MEASUREMENTS.md)
  suppress_db: 12             # residual echo suppression while only the agent talks
  reference_lag_frames: 2     # inbound frame j is matched with outbound tick j - 2
  # While the agent talks, inbound sound counts as the caller only if it is louder than echo
  # could be: peak above this share of what was just played, or (once the filter has learned the
  # path) far above the echo it predicts. Held for a while so soft syllables stay in.
  near_end_ratio: 0.35        # -9 dB; a phone hybrid returns echo 20-40 dB down, a bad one 12-18 dB
  near_end_hold_ms: 240

llm:
  model: receptionist
  temperature: 0.2
  max_tokens: 160
  hedge_after_ms: 450         # send the same request to the next provider if no token by then
  first_token_timeout_ms: 2000
  stall_timeout_ms: 1200      # a stream that goes quiet this long counts as failed
  circuit:
    failures: 3               # this many failures ...
    window_s: 30              # ... in this window open the circuit
    open_s: 20                # and keep a provider out this long
  providers:
    - name: primary
      base_url: http://127.0.0.1:8781/v1
      api_key_env: PRIMARY_LLM_API_KEY
    - name: secondary
      base_url: http://127.0.0.1:8782/v1
      api_key_env: SECONDARY_LLM_API_KEY

tools:
  filler_after_ms: 700        # say "one moment" if a tool call takes longer than this

tts:
  voices:
    en: tts_en_lessac
    de: tts_de_thorsten
  speed: 1.0
  first_chunk_min_chars: 12   # start speaking at the first clause this long
  chunk_max_chars: 160

serving:
  max_batch: 8
  max_wait_ms: 8

calls:
  max_seconds: 300
  greeting:
    en: "Hello, this is Mira at Salon Lindner. How can I help?"
    de: "Hallo, hier ist Mira vom Salon Lindner. Wie kann ich helfen?"
